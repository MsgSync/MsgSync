name: MsgSync CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: msgsync_platform_test
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
      
    - name: Run Prisma migrations
      run: |
        cd platform
        npx prisma migrate deploy
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/msgsync_platform_test?schema=public"

    - name: Run Platform Tests
      run: |
        cd platform
        npm test
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/msgsync_platform_test?schema=public"
        REDIS_URL: "redis://localhost:6379"

  test-aggregator:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm install

    - name: Run Aggregator Tests
      run: |
        cd aggregator
        npm test || echo "No tests yet"

  test-python-sdk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        cd sdk/python
        pip install requests pytest
    - name: Run SDK Tests
      run: |
        cd sdk/python
        pytest tests/ || echo "No tests found"

  test-go-sdk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    - name: Build and Test
      run: |
        cd sdk/go/msgsync
        go build ./...
        go test ./...

  test-go-services:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Test Common
      run: |
        cd services/common
        go test ./...

    - name: Test HLR Service
      run: |
        cd services/hlr-service
        go test ./...

    - name: Test SS7 Gateway
      run: |
        cd services/ss7-gateway
        go test ./...

    - name: Test SMPP Gateway
      run: |
        cd services/smpp-gateway
        go test ./...

    - name: Test Routing Engine
      run: |
        cd services/routing-engine
        go test ./...
    
    - name: Test Campaign Engine
      run: |
        cd services/campaign-engine
        go test ./...

  build-images:
    runs-on: ubuntu-latest
    needs: [test-go-services, test-platform]
    steps:
    - uses: actions/checkout@v3
    
    - name: Build HLR Service
      run: docker build -t msgsync/hlr-service -f services/hlr-service/Dockerfile .

    - name: Build SS7 Gateway
      run: docker build -t msgsync/ss7-gateway -f services/ss7-gateway/Dockerfile .

    - name: Build SMPP Gateway
      run: docker build -t msgsync/smpp-gateway -f services/smpp-gateway/Dockerfile .

    - name: Build Routing Engine
      run: docker build -t msgsync/routing-engine -f services/routing-engine/Dockerfile .

    - name: Build Campaign Engine
      run: docker build -t msgsync/campaign-engine -f services/campaign-engine/Dockerfile .
