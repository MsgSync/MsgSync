name: MsgSync CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: msgsync_platform_test
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
      
    - name: Run Prisma migrations
      run: |
        cd platform
        npx prisma migrate deploy
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/msgsync_platform_test?schema=public"

    - name: Run Platform Tests
      run: |
        cd platform
        npm test
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/msgsync_platform_test?schema=public"
        REDIS_URL: "redis://localhost:6379"

  test-aggregator:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm install

    - name: Run Aggregator Tests
      run: |
        cd aggregator
        npm test || echo "No tests yet"

  test-python-sdk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        cd sdk/python
        pip install requests pytest
    - name: Run SDK Tests
      run: |
        cd sdk/python
        pytest tests/ || echo "No tests found"

  test-go-sdk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
    - name: Build and Test
      run: |
        cd sdk/go/msgsync
        go build ./...
        go test ./...

  test-go-services:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
    
    - name: Test Common
      run: |
        cd services/common
        go test ./...

    - name: Test HLR Service
      run: |
        cd services/hlr-service
        go test ./...

    - name: Test SS7 Gateway
      run: |
        cd services/ss7-gateway
        go test ./...

    - name: Test SMPP Gateway
      run: |
        cd services/smpp-gateway
        go test ./...

    - name: Test Routing Engine
      run: |
        cd services/routing-engine
        go test ./...
    
    - name: Test Campaign Engine
      run: |
        cd services/campaign-engine
        go test ./...

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-go-services, test-platform]
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Lowercase Repo Owner
      run: |
        echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
      env:
        GITHUB_REPOSITORY_OWNER: '${{ github.repository_owner }}'

    - name: Build and Push HLR Service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/hlr-service/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.REPO_OWNER }}/hlr-service:latest
          ghcr.io/${{ env.REPO_OWNER }}/hlr-service:${{ github.sha }}

    - name: Build and Push SS7 Gateway
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/ss7-gateway/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.REPO_OWNER }}/ss7-gateway:latest
          ghcr.io/${{ env.REPO_OWNER }}/ss7-gateway:${{ github.sha }}

    - name: Build and Push SMPP Gateway
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/smpp-gateway/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.REPO_OWNER }}/smpp-gateway:latest
          ghcr.io/${{ env.REPO_OWNER }}/smpp-gateway:${{ github.sha }}

    - name: Build and Push Routing Engine
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/routing-engine/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.REPO_OWNER }}/routing-engine:latest
          ghcr.io/${{ env.REPO_OWNER }}/routing-engine:${{ github.sha }}

    - name: Build and Push Campaign Engine
      uses: docker/build-push-action@v4
      with:
        context: .
        file: services/campaign-engine/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.REPO_OWNER }}/campaign-engine:latest
          ghcr.io/${{ env.REPO_OWNER }}/campaign-engine:${{ github.sha }}
