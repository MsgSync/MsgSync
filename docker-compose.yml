services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: msgsync
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: msgsync_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  platform:
    build:
      context: ./platform
    environment:
      DATABASE_URL: "postgresql://msgsync:password123@postgres:5432/msgsync_platform?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis

  aggregator:
    build:
      context: ./aggregator
    environment:
      DATABASE_URL: "postgresql://msgsync:password123@postgres:5432/msgsync_platform?schema=public"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

  smpp-gateway:
    build:
      context: .
      dockerfile: services/smpp-gateway/Dockerfile
    environment:
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      - kafka

  routing-engine:
    build:
      context: .
      dockerfile: services/routing-engine/Dockerfile
    environment:
      KAFKA_BROKERS: "kafka:9092"
      DATABASE_URL: "postgresql://msgsync:password123@postgres:5432/msgsync_platform?schema=public"
    depends_on:
      - kafka
      - postgres

  campaign-engine:
    build:
      context: .
      dockerfile: services/campaign-engine/Dockerfile
    environment:
      KAFKA_BROKERS: "kafka:9092"
      DATABASE_URL: "postgresql://msgsync:password123@postgres:5432/msgsync_platform?schema=public"
    depends_on:
      - kafka
      - postgres

  ss7-gateway:
    build:
      context: .
      dockerfile: services/ss7-gateway/Dockerfile
    environment:
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      - kafka

  hlr-service:
    build:
      context: .
      dockerfile: services/hlr-service/Dockerfile
    environment:
      KAFKA_BROKERS: "kafka:9092"
      DATABASE_URL: "postgresql://msgsync:password123@postgres:5432/msgsync_platform?schema=public"
    depends_on:
      - kafka
      - postgres

volumes:
  postgres_data:
