global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'platform'
    static_configs:
      - targets: ['platform:3001']

  - job_name: 'smpp-gateway'
    static_configs:
      - targets: ['smpp-gateway:8081']

  - job_name: 'routing-engine'
    static_configs:
      - targets: ['routing-engine:8082']

  - job_name: 'campaign-engine'
    static_configs:
      - targets: ['campaign-engine:8083']

  - job_name: 'ss7-gateway'
    static_configs:
      - targets: ['ss7-gateway:8084']
